<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="calc-body w-25 vh-custom bg-black rounded-3 p-3 d-flex flex-column">
            <div class="num-screen w-100 h-custom mt-3 mb-3 rounded-3">
                <input id="num-input" class="num-screen-input w-100 h-100 fs-2 fw-bold" type="text">
            </div>
            <div class="num-pad row gap-1 justify-content-center h-75">
                <button id="calc-c" class="calc-button btn w-btn-custom rounded- bg-dark text-color rounded-3 col-3 col-md-3 col-lg-3">C</button>
                <button id="calc-del" class="calc-button btn w-btn-custom  bg-dark text-color rounded-3 col-3 col-md-3 col-lg-3">
                    <!-- // delete icon "deleting number by number" -->
                </button>
                <button id="calc-perc" class="calc-button btn w-btn-custom  bg-dark text-color rounded-3 col-3 col-md-3 col-lg-3">
                    <!-- // percentage icon -->
                </button>
                <button id="calc-div" class="calc-button btn w-btn-custom  bg-dark text-color rounded-3 col-3 col-md-3 col-lg-3">
                    <!-- // division icon -->
                </button>
                <button id="calc-7" class="calc-button btn w-btn-custom  bg-dark text-color rounded-3 col-3 col-md-3 col-lg-3">7</button>
                <button id="calc-8" class="calc-button btn w-btn-custom  bg-dark text-color rounded-3 col-3 col-md-3 col-lg-3">8</button>
                <button id="calc-9" class="calc-button btn w-btn-custom  bg-dark text-color rounded-3 col-3 col-md-3 col-lg-3">9</button>
                <button id="calc-mult" class="calc-button btn w-btn-custom  bg-dark text-color rounded-3 col-3 col-md-3 col-lg-3">
                    <!-- multiplication icon -->
                </button>
                <button id="calc-4" class="calc-button btn w-btn-custom  bg-dark text-color rounded-3 col-3 col-md-3 col-lg-3">4</button>
                <button id="calc-5" class="calc-button btn w-btn-custom  bg-dark text-color rounded-3 col-3 col-md-3 col-lg-3">5</button>
                <button id="calc-6" class="calc-button btn w-btn-custom  bg-dark text-color rounded-3 col-3 col-md-3 col-lg-3">6</button>
                <button id="calc-sub" class="calc-button btn w-btn-custom  bg-dark text-color rounded-3 col-3 col-md-3 col-lg-3">
                    <!-- subtraction icon -->
                </button>
                <button id="calc-1" class="calc-button btn w-btn-custom  bg-dark text-color rounded-3 col-3 col-md-3 col-lg-3">1</button>
                <button id="calc-2" class="calc-button btn w-btn-custom  bg-dark text-color rounded-3 col-3 col-md-3 col-lg-3">2</button>
                <button id="calc-3" class="calc-button btn w-btn-custom  bg-dark text-color rounded-3 col-3 col-md-3 col-lg-3">3</button>
                <button id="calc-plus" class="calc-button btn w-btn-custom  bg-dark text-color rounded-3 col-3 col-md-3 col-lg-3">
                    <!-- plus icon -->
                    +
                </button>
                <button id="calc-0" class="calc-button btn w-btn-custom  bg-dark text-color rounded-3 col-3 col-md-3 col-lg-3">0</button>
                <button id="calc-dec" class="calc-button btn w-btn-custom  bg-dark text-color rounded-3 col-3 col-md-3 col-lg-3">.</button>
                <button id="calc-erase" class="calc-button btn w-btn-custom  bg-dark rounded-3 col-3 col-md-3 col-lg-3 secondary-color">del</button>
                <button id="calc-equal" class="calc-button btn w-btn-custom  bg-dark rounded-3 col-3 col-md-3 col-lg-3 secondary-color">=</button>
            </div>
        </div>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
        <script src="./script.js"></script>
</body>
</html>
